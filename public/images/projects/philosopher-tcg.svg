    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6a2528"/>
      <stop offset="55%" stop-color="#3a1417"/>
      <stop offset="100%" stop-color="#1e090b"/>
